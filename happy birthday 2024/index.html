        /* Apply before external CSS loads, including when an older stylesheet is cached. */

    <script>
        (() => {
            const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent)
                || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
            const viewport = document.querySelector('meta[name="viewport"]');
            if (!isIOS || !viewport) return;

            let savedViewport = null;
            let restoreTimer = null;

            function restoreViewport() {
                clearTimeout(restoreTimer);
                restoreTimer = null;
                if (savedViewport === null) return;
                viewport.setAttribute('content', savedViewport);
                savedViewport = null;
            }

            function prepareNameInput(event) {
                if (event.target.id !== 'nameInput') return;
                clearTimeout(restoreTimer);
                restoreTimer = null;
                if (savedViewport !== null) return;

                savedViewport = viewport.getAttribute('content');
                // Preserve any intentional zoom; suppress only the extra focus zoom.
                const scale = Math.max(1, window.visualViewport?.scale || 1);
                const settings = savedViewport.split(',').map(value => value.trim())
                    .filter(value => !/^maximum-scale\s*=/i.test(value));
                settings.push('maximum-scale=' + scale);
                viewport.setAttribute('content', settings.join(', '));
            }

            // Touch/pointer events run before Safari focuses the input.
            document.addEventListener('pointerdown', prepareNameInput, { capture: true, passive: true });
            document.addEventListener('touchstart', prepareNameInput, { capture: true, passive: true });
            document.addEventListener('focusin', prepareNameInput);
            function scheduleViewportRestore(event) {
                if (event.target.id !== 'nameInput' || savedViewport === null) return;
                clearTimeout(restoreTimer);
                restoreTimer = setTimeout(function() {
                    if (document.activeElement?.id !== 'nameInput') restoreViewport();
                }, 300);
            }
            ['focusout', 'pointerup', 'touchend', 'pointercancel', 'touchcancel'].forEach(function(eventName) {
                document.addEventListener(eventName, scheduleViewportRestore, { passive: true });
            });
            window.addEventListener('pagehide', restoreViewport);
        })();
    </script>

<script>
    let datetxt = "06 - 11 - 2009";
    let datatxtletter = "";
    let titleLetter = " ";
    let charArrDate = datetxt.split('');
    let currentIndex = 0;
    let date__of__birth = document.querySelector(".date__of__birth span");
    let text__letter = document.querySelector(".text__letter p");
    let userName = "";

    setTimeout(function(){
        timeDatetxt = setInterval(function(){
            if(currentIndex < charArrDate.length){
                date__of__birth.textContent += charArrDate[currentIndex];
                currentIndex++;
            }
            else{
                let i = document.createElement("i");
                i.className = "fa-solid fa-star"
                document.querySelector(".date__of__birth").prepend(i)
                document.querySelector(".date__of__birth").appendChild(i.cloneNode(true))
                clearInterval(timeDatetxt)
            }
        },100)
    },)

    const letterOverlay = document.querySelector('.box__letter');
    const letterCloseButton = document.querySelector('.letter__close');
    let letterReturnFocus;
    let letterWritingTimer = null;

    function stopWritingLetter() {
        clearTimeout(letterWritingTimer);
        letterWritingTimer = null;
    }

    function prepareLetterWords(element, text) {
        const fragment = document.createDocumentFragment();
        const words = [];
        // Preserve the original spaces, punctuation, names, and emoji exactly.
        text.split(/(\s+)/u).forEach(function(part) {
            if (!part) return;
            if (/^\s+$/u.test(part)) {
                fragment.appendChild(document.createTextNode(part));
            } else {
                const word = document.createElement('span');
                word.className = 'letter__word';
                word.textContent = part;
                fragment.appendChild(word);
                words.push(word);
            }
        });
        element.replaceChildren(fragment);
        return words;
    }

    function startWritingLetter() {
        stopWritingLetter();
        const greetingWords = prepareLetterWords(document.querySelector('.title__letter'), titleLetter);
        const words = greetingWords.concat(prepareLetterWords(text__letter, datatxtletter));
        let index = 0;

        function writeNextWord() {
            if (letterOverlay.hidden || index >= words.length) {
                letterWritingTimer = null;
                return;
            }
            const word = words[index++];
            word.classList.add('is-written');
            const pause = index === greetingWords.length ? 400
                : /[.!?…]$/u.test(word.textContent) ? 360
                : /[,;:]$/u.test(word.textContent) ? 230 : 140;
            if (index < words.length) {
                letterWritingTimer = setTimeout(writeNextWord, pause);
            } else {
                letterWritingTimer = null;
            }
        }

        // All words reserve their space so the paper stays still while writing.
        letterWritingTimer = setTimeout(writeNextWord, 500);
    }

    function closeLetter() {
        if (letterOverlay.hidden) return;
        stopWritingLetter();
        letterOverlay.hidden = true;
        letterOverlay.classList.remove('is-open');
        letterOverlay.setAttribute('aria-hidden', 'true');
        document.body.classList.remove('letter-open');
        if (letterReturnFocus) letterReturnFocus.focus({ preventScroll: true });
    }

    document.getElementById('btn__letter').addEventListener('click', function() {
        updateLetterContent();
        startWritingLetter();
        letterReturnFocus = document.activeElement;
        letterOverlay.hidden = false;
        letterOverlay.setAttribute('aria-hidden', 'false');
        letterOverlay.classList.add('is-open');
        document.body.classList.add('letter-open');
        document.querySelector('.letter__border').scrollTop = 0;
        letterCloseButton.focus({ preventScroll: true });
    });

    letterCloseButton.addEventListener('click', closeLetter);
    letterOverlay.addEventListener('click', function(event) {
        if (event.target === letterOverlay) closeLetter();
    });
    letterOverlay.addEventListener('keydown', function(event) {
        if (event.key === 'Escape') closeLetter();
        // The close button is the only interactive element inside the letter.
        if (event.key === 'Tab') {
            event.preventDefault();
            letterCloseButton.focus();
        }
    });

    function updateLetterContent() {
        titleLetter = `Dear ${userName} `;
        datatxtletter = `Hôm nay là sinh nhật của  ${userName}. Mình chúc ${userName} sinh nhật vui vẻ, tuổi mới luôn xinh đẹp, cười nhiều và bớt áp lực chuyện học. Mong ${userName} thi đỗ nguyện vọng mình muốn, nhưng nhớ nghỉ ngơi, đừng ép bản thân quá nhé. I wish you all the best, my best friend 🤍`;
        document.querySelector('.title__letter').textContent = titleLetter;
        text__letter.textContent = datatxtletter;
        document.querySelector('.letter__date').textContent = datetxt.split(' - ').slice(0, 2).join(' / ');
    }

    $('#submitName').on('click', function() {
        userName = $('#nameInput').val();
        if (userName) {
            document.getElementById('nameInput').blur();
            $('#nameModal').hide();
            $('.content').show();
            updateLetterContent();
        } else {
            alert('Vui lòng nhập tên của bạn.');
        }
    });

    //mobile

    function mobile(){
        const app = {
            timeout: function(txt, dom){
                let currentIndex = 0;
                let charArr = txt.split('')
                intervalMobile = setInterval(function(){
                    if(currentIndex < charArr.length){
                        dom.textContent += charArr[currentIndex];
                        currentIndex++;
                    }
                    else{
                        clearInterval(intervalMobile)
                    }
                },200)
            }
        }
        return app
    }
    const fcMobile = mobile()
    if(window.innerWidth < 768){
        setTimeout(()=>{
            fcMobile.timeout("06", document.querySelector(".day"))
        },5000)
        setTimeout(()=>{
            fcMobile.timeout("11", document.querySelector(".month"))
        },6000)
    }
    
</script>

<script>
    // Ảnh đầu -> giao diện xuất hiện đủ -> video -> nút mở thư và slideshow.
    (function() {
        const videoEl = document.getElementById('birthdayVideo');
        const content = document.querySelector('.content');
        const wrapper = document.getElementById('wrapper');
        const waitingText = document.querySelector('.waiting__text');
        const letterBtn = document.querySelector('.left .btn');
        const interactionEvents = ['click', 'touchend', 'keydown'];
        let introScheduled = false;
        let introReady = false;
        let videoFinished = false;
        let playPending = false;
        let slideshowStarted = false;

        function configureInlineVideo() {
            if (!videoEl) return;
            videoEl.muted = true;
            videoEl.defaultMuted = true;
            videoEl.playsInline = true;
            videoEl.controls = false;
            videoEl.disablePictureInPicture = true;
            videoEl.disableRemotePlayback = true;
            videoEl.setAttribute('playsinline', '');
            videoEl.setAttribute('webkit-playsinline', '');
        }

        function keepVideoInFrame(event) {
            if (!videoEl) return;
            if (videoEl.webkitPresentationMode && videoEl.webkitPresentationMode !== 'inline'
                && typeof videoEl.webkitSetPresentationMode === 'function') {
                try { videoEl.webkitSetPresentationMode('inline'); } catch {}
            }
            if (videoEl.webkitDisplayingFullscreen || event?.type === 'webkitbeginfullscreen') {
                const exitFullscreen = videoEl.webkitExitFullscreen || videoEl.webkitExitFullScreen;
                if (typeof exitFullscreen === 'function') {
                    try { exitFullscreen.call(videoEl); } catch {}
                }
            }
            if (document.fullscreenElement === videoEl || document.webkitFullscreenElement === videoEl) {
                const exitFullscreen = document.exitFullscreen || document.webkitExitFullscreen;
                if (typeof exitFullscreen === 'function') {
                    try {
                        const request = exitFullscreen.call(document);
                        if (request && typeof request.catch === 'function') request.catch(function() {});
                    } catch {}
                }
            }
        }

        if (videoEl) {
            configureInlineVideo();
            videoEl.pause();
            videoEl.currentTime = 0;
            videoEl.classList.remove('playing');
        }
        if (waitingText) waitingText.classList.remove('show');
        if (letterBtn) letterBtn.classList.remove('active');

        const allSlides = Array.from(document.querySelectorAll('.image .slide'));
        allSlides.forEach(function(img) {
            img.onerror = function() { this.remove(); };
            img.classList.remove('active');
        });

        function startPhotoSlideshow() {
            if (slideshowStarted) return;
            slideshowStarted = true;
            const validSlides = Array.from(document.querySelectorAll('.image .slide'));
            if (!validSlides.length) return;
            let activeSlide = validSlides[0];
            activeSlide.classList.add('active');
            if (validSlides.length === 1) return;

            const slideInterval = setInterval(function() {
                const slides = Array.from(document.querySelectorAll('.image .slide'));
                if (!slides.length) {
                    clearInterval(slideInterval);
                    return;
                }
                const nextIndex = (slides.indexOf(activeSlide) + 1) % slides.length;
                activeSlide.classList.remove('active');
                activeSlide = slides[nextIndex];
                activeSlide.classList.add('active');
                if (slides.length === 1) clearInterval(slideInterval);
            }, 3000);
        }

        function finishVideo() {
            if (!introReady || videoFinished) return;
            videoFinished = true;
            if (videoEl) {
                videoEl.classList.remove('playing');
                videoEl.pause();
            }
            if (waitingText) {
                waitingText.classList.remove('show');
                waitingText.classList.add('hide');
            }
            if (letterBtn) letterBtn.classList.add('active');
            startPhotoSlideshow();
            interactionEvents.forEach(function(eventName) {
                document.removeEventListener(eventName, resumeVideo, true);
            });
        }

        function onVideoPlaying() {
            if (!introReady) {
                videoEl.pause();
                videoEl.currentTime = 0;
                return;
            }
            if (videoFinished) return;
            keepVideoInFrame();
            videoEl.classList.add('playing');
            if (waitingText) {
                waitingText.classList.remove('hide');
                waitingText.classList.add('show');
            }
        }

        function tryPlayVideo() {
            if (!videoEl || videoFinished || playPending) return;
            playPending = true;
            configureInlineVideo();
            try {
                if (videoEl.error) videoEl.load();
                const request = videoEl.play();
                if (request && typeof request.then === 'function') {
                    request.then(function() {
                        playPending = false;
                        if (!introReady) {
                            videoEl.pause();
                            videoEl.currentTime = 0;
                        }
                    }, function() {
                        // Never skip the video or reveal the letter on a play rejection.
                        playPending = false;
                    });
                } else {
                    playPending = false;
                }
            } catch {
                playPending = false;
            }
        }

        function resumeVideo() {
            if (introReady && !videoFinished && videoEl && videoEl.paused
                && document.visibilityState !== 'hidden') {
                tryPlayVideo();
            }
        }

        function startPresentation() {
            if (introReady) return;
            introReady = true;
            if (videoEl) tryPlayVideo();
            else finishVideo();
        }

        function schedulePresentation() {
            if (introScheduled || !content || window.getComputedStyle(content).display === 'none') return;
            introScheduled = true;

            // The circle must finish its entrance before any video playback begins.
            configureInlineVideo();

            if (wrapper && typeof wrapper.getAnimations === 'function') {
                const entranceAnimations = wrapper.getAnimations({ subtree: true }).filter(function(animation) {
                    return animation.effect && animation.playState !== 'finished'
                        && animation.playState !== 'idle'
                        && Number.isFinite(animation.effect.getComputedTiming().endTime);
                });
                Promise.all(entranceAnimations.map(function(animation) {
                    return animation.finished.catch(function() {});
                })).then(startPresentation);
            } else {
                // Fallback for browsers without the animation API; includes the final decorations.
                setTimeout(startPresentation, window.innerWidth < 768 ? 9000 : 19000);
            }
        }

        if (videoEl) {
            videoEl.addEventListener('playing', onVideoPlaying);
            videoEl.addEventListener('webkitbeginfullscreen', keepVideoInFrame);
            videoEl.addEventListener('webkitpresentationmodechanged', keepVideoInFrame);
            document.addEventListener('fullscreenchange', keepVideoInFrame);
            document.addEventListener('webkitfullscreenchange', keepVideoInFrame);
            videoEl.addEventListener('ended', finishVideo);
            videoEl.addEventListener('loadeddata', resumeVideo);
            videoEl.addEventListener('canplay', resumeVideo);
            interactionEvents.forEach(function(eventName) {
                document.addEventListener(eventName, resumeVideo, { capture: true, passive: true });
            });
            document.addEventListener('visibilitychange', resumeVideo);
        }

        const submitBtn = document.getElementById('submitName');
        if (submitBtn) submitBtn.addEventListener('click', schedulePresentation);
        if (content && window.getComputedStyle(content).display !== 'none') schedulePresentation();
    })();
</script>
</body>
</html>
